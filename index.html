<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thoughtbot Hero Section</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background: #1a0d0d;
            color: #fff;
            font-family: "Inter", sans-serif;
        }

        /* NAVBAR */
        .navbar-nav .nav-link {
            color: #ffffff !important;
            font-size: 17px;
            margin: 0 12px;
        }

        .btn-started {
            background: #e63939;
            color: #fff;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 30px;
        }

        /* HERO SECTION */
        .hero-title {
            font-size: 55px;
            font-weight: 700;
            line-height: 1.1;
        }

        .hero-text {
            font-size: 20px;
            max-width: 550px;
        }

        .btn-talk {
            background: #e63939;
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            margin-top: 25px;
            font-size: 19px;
            font-weight: 600;
        }

        /* IMAGE BLOCKS */
        .image-wrapper {
            position: relative;
            height: 560px;
        }

        .hero-img {
            position: absolute;
            border-radius: 32px;
            transition: opacity .8s ease-in-out;
            opacity: 1;
        }

        .hero-img img {
            width: 230px;
            border-radius: 32px;
        }

        #img1 { top: 0; left: 10%; }
        #img2 { top: 0; right: 8%; }
        #img3 { bottom: 0; right: 20%; }

        .hidden {
            opacity: 0;
        }

        @media (max-width: 991px) {
            .image-wrapper {
                height: 380px;
            }
            .hero-img img {
                width: 160px;
            }
            #img1 { left: 0; }
            #img2 { right: 0; }
            #img3 { right: 10%; bottom: 0; }
        }

        @media (max-width: 576px) {
            .hero-title {
                font-size: 36px;
            }
            .hero-img img {
                width: 130px;
            }
            .image-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>

<!-- NAVIGATION -->
<nav class="navbar navbar-expand-lg py-4">
    <div class="container">
        <a class="navbar-brand text-white fw-bold d-flex align-items-center" href="#">
            <img src="logo.png" width="40" class="me-2">
            thoughtbot
        </a>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Case Studies</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Resources</a></li>
            </ul>

            <a href="#" class="btn btn-started">Let’s get started!</a>
        </div>
    </div>
</nav>

<!-- HERO SECTION -->
<section class="container py-5">
    <div class="row">
        
        <!-- LEFT TEXT -->
        <div class="col-lg-6 mb-5">
            <h1 class="hero-title mb-4">Let’s make your product and team a success</h1>

            <p class="hero-text">
                thoughtbot is your expert partner for product design and development. 
                We help our clients lead the way through better products, faster teams, 
                and stronger growth.
            </p>

            <button class="btn btn-talk">Let’s talk</button>
        </div>

        <!-- RIGHT ANIMATED IMAGES -->
        <div class="col-lg-6">
            <div class="image-wrapper">

                <div class="hero-img" id="img1">
                    <img src="https://hub.thoughtbot.com/rails/active_storage/representations/redirect/eyJfcmFpbHMiOnsiZGF0YSI6NjU3OCwicHVyIjoiYmxvYl9pZCJ9fQ==--f63b6bd97e5fd0b4a6bd7f49cd2b2fdbbecb561e/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJwbmciLCJxdWFsaXR5IjoiMTAwJSIsInJlc2l6ZV90b19maWxsIjpbMzIwLDMyMCx7ImdyYXZpdHkiOiJub3J0aCJ9XSwic2hhcnBlbiI6IjB4MSJ9LCJwdXIiOiJ2YXJpYXRpb24ifX0=--4e69eea56bee5c4c1ba95083ed4c16d30c700c0a/Sarah_Lima_.png">
                </div>

                <div class="hero-img" id="img2">
                    <img src="https://hub.thoughtbot.com/rails/active_storage/representations/redirect/eyJfcmFpbHMiOnsiZGF0YSI6NjU3OSwicHVyIjoiYmxvYl9pZCJ9fQ==--d780961076d18c35576055cfb0d5113b5a0908af/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJwbmciLCJxdWFsaXR5IjoiMTAwJSIsInJlc2l6ZV90b19maWxsIjpbMzIwLDMyMCx7ImdyYXZpdHkiOiJub3J0aCJ9XSwic2hhcnBlbiI6IjB4MSJ9LCJwdXIiOiJ2YXJpYXRpb24ifX0=--4e69eea56bee5c4c1ba95083ed4c16d30c700c0a/Rakesh_Arunachalam.png">
                </div>

                <div class="hero-img" id="img3">
                    <img src="https://hub.thoughtbot.com/rails/active_storage/representations/redirect/eyJfcmFpbHMiOnsiZGF0YSI6MzM1NCwicHVyIjoiYmxvYl9pZCJ9fQ==--22897da3a5f17337183b4288a35e84db3dd02e5b/eyJfcmFpbHMiOnsiZGF0YSI6eyJmb3JtYXQiOiJwbmciLCJxdWFsaXR5IjoiMTAwJSIsInJlc2l6ZV90b19maWxsIjpbMzIwLDMyMCx7ImdyYXZpdHkiOiJub3J0aCJ9XSwic2hhcnBlbiI6IjB4MSJ9LCJwdXIiOiJ2YXJpYXRpb24ifX0=--4e69eea56bee5c4c1ba95083ed4c16d30c700c0a/Sally_Hall_.png">
                </div>

            </div>
        </div>
    </div>
</section>

<script>
let img1 = document.getElementById("img1");
let img2 = document.getElementById("img2");
let img3 = document.getElementById("img3");

let current = 1;

function animateImages() {
    img1.classList.remove("hidden");
    img2.classList.remove("hidden");
    img3.classList.remove("hidden");

    if (current === 1) img1.classList.add("hidden");
    if (current === 2) img2.classList.add("hidden");
    if (current === 3) img3.classList.add("hidden");

    current++;
    if (current > 3) current = 1;
}

setInterval(animateImages, 2300);
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
