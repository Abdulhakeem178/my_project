<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        * {
            text-decoration: none;
        }
        .navbar {
            background: burlywood;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding-left: 15px;
            padding-right: 15px;
            
        }
        .navdiv {
            align-items: center;
            justify-content: space-between;
            display: flex;
        }
        .logo a{
            font-size: medium;
            color: azure;
            font-weight: 600;
        }
        li {
            list-style: none;
            display: inline-block;
        }
        li a {
            font-size: 20px;
            color: aliceblue;
            margin-right: 20px;
            font-weight: 200;
        }
        button {
            background-color: blanchedalmond;
            padding: 5px;
            margin-right: 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo"><a href="#">DEV MINDED</a></div>
            <ul>
                <li> <a href="#">Home</a></li>
                <li> <a href="#">Service</a></li>
                <li> <a href="#">Product</a></li>
                <li> <a href="#">About</a></li>
                <button><a href="#">Signin</a></button>  
                <button><a href="#">Signout</a></button>  
            </ul>
            
        </div>
    </nav>
</body>
</html>
