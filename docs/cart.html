<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Quantum Store</title>

    <link rel="stylesheet" href="css/design.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">

                <h2>Quantum<span>Store</span></h2>

            </div>

            <div class="nav-right">

    <a href="index.html">
        <i class="fa-solid fa-house"></i>
        Home
    </a>

    <a href="login.html" id="login-link">
        <i class="fa-regular fa-user"></i>
        Login
    </a>

    <a href="register.html" id="register-link">
        Register
    </a>

    <span id="user-welcome" style="display:none;"></span>

    <a href="#" id="logout-link" style="display:none;">
        Logout
    </a>

    <a href="cart.html" class="cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-count">0</span>
    </a>

</div>

        </nav>

    </header>

    <main class="cart-page">

        <h1>Shopping Cart</h1>

        <div class="cart-items">

            <!-- Products will appear here -->

        </div>

       <div class="cart-summary">

    <h2>Order Summary</h2>

    <div class="summary-row">
        <span>Items</span>
        <span>$<span id="items-total">0.00</span></span>
    </div>

    <div class="summary-row">
        <span>Shipping</span>
        <span>FREE</span>
    </div>

    <div class="summary-row">
        <span>Tax (10%)</span>
        <span>$<span id="tax-total">0.00</span></span>
    </div>

    <hr>

    <div class="summary-row total-row">
        <strong>Total</strong>
        <strong>$<span id="cart-total">0.00</span></strong>
    </div>

    <a href="checkout.html">

    <button class="checkout-btn">

        Proceed To Checkout

    </button>

</a>

</div>

    </main>

    <script src="../js/cart.js"></script>

</body>

</html>
